[package]
name = "zhoor-risk-policy"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Deterministic, non-authoritative ZHOOR v1 risk policy"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
zhoor-protocol = { path = "../protocol" }

[dev-dependencies]
jsonschema = { version = "=0.33.0", default-features = false }
