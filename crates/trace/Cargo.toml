[package]
name = "zhoor-trace"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Sanitized, replayable ZHOOR decision traces"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "=0.10.9"
zhoor-protocol = { path = "../protocol" }

[dev-dependencies]
jsonschema = { version = "=0.33.0", default-features = false }
